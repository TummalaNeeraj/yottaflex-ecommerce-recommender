[project]
name = "yottaflex-ecommerce-recommender"
version = "0.1.0"
description = "Reproducible synthetic e-commerce data and recommendation pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
reports = ["Pillow>=10.0"]

[project.scripts]
ecommerce-synth = "ecommerce_synth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_synth"]


